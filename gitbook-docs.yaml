$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Exploratory
  structure:
    - type: section
      key: section-docs
      title: Documentation
      path: docs
      default: true
      children:
        - type: space
          key: space-docs-ja
          title: 日本語
          path: ja
          default: true
          content:
            directory: ./docs/ja
            language: ja
    - type: space
      key: space-docs
      title: Documentation
      path: docs
      default: true
      content:
        directory: ./en
