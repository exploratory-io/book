$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Exploratory
  structure:
    - type: section
      key: section-docs
      title: Documentation
      path: docs
      default: true
      children:
        - type: space
          key: space-docs
          title: English
          path: en
          default: true
          content:
            directory: ./en
            language: en
        - type: space
          key: space-docs-ja
          title: 日本語
          path: ja
          content:
            directory: ./ja
            language: ja
